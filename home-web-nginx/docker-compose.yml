services:
  home-web-nginx:
    container_name: home-web-nginx
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Tokyo
    networks:
      - home_network
    restart: always
networks:
  home_network:
    external: true
