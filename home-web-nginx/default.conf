# HMS-SPRING 用
server {
    listen 443 ssl;
    server_name hms.home.arpa;

    ssl_certificate     /etc/nginx/certs/hms.crt;
    ssl_certificate_key /etc/nginx/certs/hms.key;

    location / {
        proxy_pass http://hms-ap:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HMS-NEXTJS 用
server {
    listen 443 ssl;
    server_name sp.hms.home.arpa;

    ssl_certificate     /etc/nginx/certs/sp-hms.crt;
    ssl_certificate_key /etc/nginx/certs/sp-hms.key;

    location / {
        proxy_pass http://hms-nextjs:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# AdGuard Home 用
server {
    listen 443 ssl;
    server_name adg.home.arpa;

    ssl_certificate     /etc/nginx/certs/adg.crt;
    ssl_certificate_key /etc/nginx/certs/adg.key;

    location / {
        proxy_pass http://adguardhome:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# grafana 用
server {
    listen 443 ssl;
    server_name grf.home.arpa;

    ssl_certificate     /etc/nginx/certs/grf.crt;
    ssl_certificate_key /etc/nginx/certs/grf.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://grafana:3000;
    }
}

# jenkins 用
server {
    listen 443 ssl;
    server_name jnk.home.arpa;

    ssl_certificate     /etc/nginx/certs/jnk.crt;
    ssl_certificate_key /etc/nginx/certs/jnk.key;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://jenkins:8080/;
    }
}

# HB 用
server {
    listen 443 ssl;
    server_name hb.home.arpa;

    ssl_certificate     /etc/nginx/certs/hb.crt;
    ssl_certificate_key /etc/nginx/certs/hb.key;

    location / {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://hb-ap:80/;
    }
}

# HV 用
server {
    listen 443 ssl;
    server_name hv.home.arpa;

    ssl_certificate     /etc/nginx/certs/hv.crt;
    ssl_certificate_key /etc/nginx/certs/hv.key;

    location / {
        proxy_pass http://hv-web:80/; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HC 用
server {
    listen 443 ssl;
    server_name hc.home.arpa;

    ssl_certificate     /etc/nginx/certs/hc.crt;
    ssl_certificate_key /etc/nginx/certs/hc.key;

    location /ap/ {
        proxy_pass http://hc-ap:8080/ap/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
    }

    location / {
        proxy_pass http://hc-nginx:80/;
    }
}