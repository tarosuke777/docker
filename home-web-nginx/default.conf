server {
    listen 80;
    server_name www.home.arpa;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.home.arpa;

    # --- SSL証明書の設定 ---
    ssl_certificate     /etc/nginx/certs/www.crt;
    ssl_certificate_key /etc/nginx/certs/www.key;

    # プロトコルや暗号化スイートのセキュア化（推奨設定）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location /hc/ap/ {
        proxy_pass http://hc-ap:8080/hc/ap/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
    }

    location /hc/ {
        proxy_pass http://hc-nginx:80/hc/;
    }

    location /hb/ {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://hb-ap:80/hb/;
    }

    location /hv/ {
        proxy_pass http://hv-web:80/hv/; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /hv;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /jenkins/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://jenkins:8080/jenkins/;
        
        proxy_redirect http://jenkins:8080/jenkins/ https://$host/jenkins/;
    }
    
    location /grafana/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://grafana:3000;
    }

    # location / {
    #     proxy_pass http://hms-ap:8080/hms/;
    # }
}

# HMS 用
server {
    listen 443 ssl;
    server_name hms.home.arpa;

    ssl_certificate     /etc/nginx/certs/hms.crt;
    ssl_certificate_key /etc/nginx/certs/hms.key;

    location / {
        proxy_pass http://hms-ap:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}


# AdGuard Home 用
server {
    listen 443 ssl;
    server_name adg.home.arpa;

    ssl_certificate     /etc/nginx/certs/adg.crt;
    ssl_certificate_key /etc/nginx/certs/adg.key;

    location / {
        proxy_pass http://adguardhome:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
